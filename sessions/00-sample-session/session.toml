# ==============================================================================
# セッション設定ファイル (session.toml)
# ここを変更するだけで、提出用ファイル名（dist/）とドキュメントのヘッダーが一括更新されます。
# ==============================================================================

section_no    = "01"
session_id    = "§1"
title         = "セッション名（サンプル）"
session_name  = "§1. セッション名（サンプル）"
event_short   = "〇〇回BS講習会"

# ドキュメント（要項・口述要項・配布資料）ヘッダー用メタデータ
course_name   = "20xx年度 指導者研修コース"
date          = "20xx年〇月〇日"
datetime_info = "20xx年〇月〇日(〇) 00:00〜00:45 (45分)"
trainer_name  = "指導 太郎"

# ==============================================================================
# 提出・Google Drive共有用ファイル出力定義 (dist/)
# 出力形式: {section_no}-{sub_no}_{session_name}_{label}_{event_short}.{ext}
# ==============================================================================

[files.slides]
sub_no = "00"
label  = "スライド資料"
source = "slides.md"

[files.plan]
sub_no = "01"
label  = "セッションの進め方"
source = "plan.typ"

[files.script]
sub_no = "02"
label  = "口述要項"
source = "script.typ"

[files.handout]
sub_no = "03"
label  = "配布資料"
source = "handout.typ"
